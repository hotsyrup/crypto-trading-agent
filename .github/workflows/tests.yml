name: Tests

on: [push, pull_request]

permissions: {contents: read}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - {name: Download repository, uses: actions/checkout@v6}
      - name: Set up Python
        uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - {name: Install dependencies, run: pip install -r requirements.txt}
      - {name: Run tests, run: python -m unittest discover -s tests}
      - {name: Build paper bot container, run: docker build -t crypto-trading-agent .}
