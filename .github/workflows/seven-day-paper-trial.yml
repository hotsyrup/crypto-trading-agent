name: Seven-day paper trial

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  paper-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore paper state
        uses: actions/cache/restore@v5
        with:
          path: data
          key: paper-trial-${{ github.run_id }}
          restore-keys: paper-trial-
      - name: Run one paper cycle
        run: python -m app.trending_trial
      - name: Save paper state
        uses: actions/cache/save@v5
        with:
          path: data
          key: paper-trial-${{ github.run_id }}
      - name: Upload paper report data
        uses: actions/upload-artifact@v7
        with:
          name: paper-trial-${{ github.run_id }}
          path: data/
          retention-days: 14
